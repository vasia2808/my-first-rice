general {
    hide_cursor = true
}

animations {
    animation = fadeIn, 1, 6, default
    animation = fadeOut, 1, 5, default
}

background {
    path = ~/Pictures/Wallpapers/Red Lily Spider by AssassinWarrior.jpg
    blur_passes = 3
}

label {
    text = $TIME
    color = rgb(201, 201, 201)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    shadow_passes = 1
    shadow_color = rgb(1a1a1a)
    shadow_boost = 0.7
}

label {
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(201, 201, 201, 0.85)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -25
    shadow_passes = 1
    shadow_color = rgb(1a1a1a)
    shadow_boost = 0.7
}

input-field {
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.21
    outer_color = rgb(8c2d2a)
    inner_color = rgba(25, 19, 25, 0.75)
    rounding = 5
    font_color = rgb(201, 201, 201)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span alpha='60%'>Input password</span></i>
    check_color = rgb(a66a29)
    fail_color = rgb(8c2d2a)
    position = 0, -95
}

